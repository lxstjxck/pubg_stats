[package]
name = "pubg-ranked-overlay"
version = "1.0.0"
description = "Desktop OBS overlay helper for PUBG ranked stats"
authors = ["PUBG Ranked Overlay"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "6"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tiny_http = "0.12"
url = "2"
urlencoding = "2"
